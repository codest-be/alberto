schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

"An active processor lease found via admin inspection."
type ActiveProcessorLease {
  consumerId: String!
  replicaId: String
  expiresAt: DateTime!
}

"Envelope for admin audit trail subscription messages."
type AdminAuditEntry {
  eventType: String!
  operatorId: String!
  description: String!
  timestamp: DateTime!
}

"One addressable event store, as seen by the admin surface."
type AdminModuleInfo {
  "Pass this as the module argument on any admin field."
  key: String!
  "The database schema holding the module's tables."
  schema: String!
  "Whether this module answers when module is omitted."
  isDefault: Boolean!
  """
  Whether the module's schema carries tenant identity. A client should only offer a
  tenant filter when this is MultiTenant.
  """
  tenancyMode: AdminTenancyMode!
}

"Envelope for rebuild lifecycle subscription messages."
type AdminRebuildEvent {
  processorId: String!
  action: String!
  status: String!
}

"""
Admin view of a tenant lease row from the multi-tenant lease table.
Distinct from Alberto.Dcb.Subscriptions.TenantLease (the domain record) —
this carries the full admin surface including consumer and replica IDs.
"""
type AdminTenantLease {
  tenantId: String!
  consumerId: String!
  replicaId: String
  expiresAt: DateTime
}

"Checkpoint row for a single processor."
type CheckpointInfo {
  processorId: String!
  lastPosition: Long!
  updatedAt: DateTime
}

"Result of a checkpoint set\/reset mutation."
type CheckpointMutationResult {
  processorId: String!
  success: Boolean!
  message: String
}

"Result of a create mutation."
type CreateOrderResult {
  orderId: UUID!
}

"Result of a dead letter clear mutation."
type DeadLetterClearResult {
  deletedCount: Int!
}

"Dead letter entry summary returned by admin inspection queries."
type DeadLetterInfo {
  id: UUID!
  processorId: String!
  eventType: String
  globalPosition: Long
  errorMessage: String
  failedAt: DateTime
  tenantId: String
}

"Event summary returned by admin inspection queries."
type EventInfo {
  globalPosition: Long!
  eventType: String!
  tags: String
  createdAt: DateTime
  tenantId: String
}

"Result of initiating a payment."
type InitiatePaymentResult {
  paymentId: UUID!
}

type Mutation {
  "Creates a new order with the specified line items."
  createOrder(input: CreateOrderInput!): CreateOrderResult! @cost(weight: "10")
  "Adds a line item to an existing draft order."
  addOrderItem(input: AddOrderItemInput!): MutationResult! @cost(weight: "10")
  "Removes a line item from a draft order."
  removeOrderItem(orderId: UUID! productId: UUID!): MutationResult! @cost(weight: "10")
  "Confirms a draft order, making it ready for shipment."
  confirmOrder(orderId: UUID!): MutationResult! @cost(weight: "10")
  "Ships a confirmed order with tracking information."
  shipOrder(input: ShipOrderInput!): MutationResult! @cost(weight: "10")
  "Marks a shipped order as delivered."
  deliverOrder(orderId: UUID!): MutationResult! @cost(weight: "10")
  "Cancels a draft or confirmed order."
  cancelOrder(input: CancelOrderInput!): MutationResult! @cost(weight: "10")
  "Initiates a new payment for an order."
  initiatePayment(input: InitiatePaymentInput!): InitiatePaymentResult! @cost(weight: "10")
  "Authorizes a payment with an authorization code."
  authorizePayment(paymentId: UUID! authorizationCode: String!): MutationResult! @cost(weight: "10")
  "Captures a previously authorized payment."
  capturePayment(input: CapturePaymentInput!): MutationResult! @cost(weight: "10")
  "Marks a payment as failed."
  failPayment(input: FailPaymentInput!): MutationResult! @cost(weight: "10")
  "Refunds a previously captured payment."
  refundPayment(input: RefundPaymentInput!): MutationResult! @cost(weight: "10")
  "Set a processor checkpoint to a specific position. Appends an audit event."
  adminSetCheckpoint(processorId: String! position: Long! operatorId: String module: String): CheckpointMutationResult! @cost(weight: "10")
  "Delete a processor checkpoint entirely. The processor replays from position 0."
  adminResetCheckpoint(processorId: String! operatorId: String module: String): CheckpointMutationResult! @cost(weight: "10")
  "Remove all dead letter entries across every processor."
  adminClearAllDeadLetters(operatorId: String module: String): DeadLetterClearResult! @cost(weight: "10")
  "Remove all dead letter entries for a specific processor."
  adminClearDeadLettersForProcessor(processorId: String! operatorId: String module: String): DeadLetterClearResult! @cost(weight: "10")
  "Atomically rewind a processor checkpoint to before its earliest dead letter, then clear all dead letters."
  adminRetryByRewind(processorId: String! operatorId: String module: String): RetryByRewindMutationResult! @cost(weight: "10")
  "Release tenant leases, forcing the application to reacquire them."
  adminReleaseTenantLeases(consumerId: String operatorId: String module: String): TenantLeaseReleaseResult! @cost(weight: "10")
  "Start a zero-downtime projection rebuild. The rebuild runs in the application."
  adminStartRebuild(processorId: String! projectionType: String! targetPosition: Long! operatorId: String module: String): RebuildStartResult! @cost(weight: "10")
  "Promote a finished rebuild, making it the active version."
  adminPromoteRebuild(processorId: String! operatorId: String module: String force: Boolean! = false): RebuildPromoteResult! @cost(weight: "10")
  "Abort an in-flight rebuild and discard the partial state."
  adminAbortRebuild(processorId: String! operatorId: String module: String): RebuildAbortResult! @cost(weight: "10")
}

"Result of a mutation that doesn't return data."
type MutationResult {
  success: Boolean!
}

"GraphQL type for Order."
type Order {
  orderId: UUID!
  customerId: UUID!
  lineItems: [OrderItem!]!
  notes: String
  status: OrderStatus!
  total: Decimal!
  trackingNumber: String
  carrier: String
  cancellationReason: String
  createdAt: DateTime!
  confirmedAt: DateTime
  shippedAt: DateTime
  deliveredAt: DateTime
  cancelledAt: DateTime
  updatedAt: DateTime
}

"GraphQL type for order line item."
type OrderItem {
  productId: UUID!
  productName: String!
  quantity: Int!
  unitPrice: Decimal!
  total: Decimal!
}

"Paginated connection for orders."
type OrdersConnection {
  items: [Order!]!
  totalCount: Int!
  skip: Int!
  take: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

"""
Aggregate read model for orders overview dashboard.
Single document per tenant tracking order statistics.
"""
type OrdersOverview {
  totalOrders: Int!
  draftOrders: Int!
  confirmedOrders: Int!
  shippedOrders: Int!
  deliveredOrders: Int!
  cancelledOrders: Int!
  totalRevenue: Decimal!
  averageOrderValue: Decimal!
  lastOrderAt: DateTime
  updatedAt: DateTime!
}

"GraphQL type for Payment."
type Payment {
  paymentId: UUID!
  orderId: UUID!
  amount: Decimal!
  currency: String!
  paymentMethod: String!
  status: PaymentStatus!
  authorizationCode: String
  errorCode: String
  errorMessage: String
  refundedAmount: Decimal
  createdAt: DateTime!
  authorizedAt: DateTime
  capturedAt: DateTime
  refundedAt: DateTime
}

"Overview\/aggregate read model for payments."
type PaymentsOverview {
  totalPayments: Int!
  authorizedPayments: Int!
  capturedPayments: Int!
  failedPayments: Int!
  refundedPayments: Int!
  totalCapturedAmount: Decimal!
  totalRefundedAmount: Decimal!
}

"Summary of a processor's checkpoint position as seen from the admin surface."
type ProcessorInfo {
  processorId: String!
  lastPosition: Long!
  updatedAt: DateTime
}

"Projection state row."
type ProjectionState {
  documentId: String!
  tenantId: String
  updatedAt: DateTime
}

type Query {
  "Gets an order by ID, rebuilt from events for consistency."
  order(orderId: UUID!): Order @cost(weight: "10")
  "Gets aggregated order statistics from the async projection."
  ordersOverview: OrdersOverview @cost(weight: "10")
  "Gets orders with optional filtering by status, customer, and date range."
  orders(status: OrderStatus customerId: UUID createdAfter: DateTime createdBefore: DateTime skip: Int! = 0 take: Int! = 20): OrdersConnection! @cost(weight: "10")
  "Gets recent orders, ordered by creation date."
  recentOrders(limit: Int! = 20): [Order!]! @cost(weight: "10")
  "Gets a payment by ID, rebuilt from events for consistency."
  payment(paymentId: UUID!): Payment @cost(weight: "10")
  "Gets aggregated payment statistics from the async projection."
  paymentsOverview: PaymentsOverview @cost(weight: "10")
  "Gets the calling tenant's recent payments, ordered by last update."
  recentPayments(limit: Int! = 20): [Payment!]! @cost(weight: "10")
  "Event stores this admin surface can address. Pass a key as the 'module' argument on any other admin field. Positions from different modules are unrelated and must not be compared."
  adminModules: [AdminModuleInfo!]! @cost(weight: "10")
  "Aggregate system stats: global position, processor count, DLQ count, last event timestamp."
  adminSystemInfo(module: String): SystemInfo! @cost(weight: "10")
  "All processor checkpoints with position and last-updated timestamp."
  adminCheckpoints(module: String): [CheckpointInfo!]! @cost(weight: "10")
  "Checkpoint for a single processor. Returns null if no checkpoint exists."
  adminCheckpoint(processorId: String! module: String): CheckpointInfo @cost(weight: "10")
  "Dead letter entries filtered by processor, event type, and\/or tenant. Most recent first. Filtering by tenant on a single-tenant module is an error."
  adminDeadLetters(processorId: String eventType: String tenant: String module: String limit: Int! = 50): [DeadLetterInfo!]! @cost(weight: "10")
  "Total count of dead letter entries across all processors."
  adminDeadLetterCount(module: String): Int! @cost(weight: "10")
  "Event log entries filtered by type, tag, and\/or tenant. Returns events after a given position. Filtering by tenant on a single-tenant module is an error."
  adminEvents(eventType: String tag: String tenant: String module: String afterPosition: Long! = 0 limit: Int! = 50): [EventInfo!]! @cost(weight: "10")
  "All processors with their checkpoint positions."
  adminProcessors(module: String): [ProcessorInfo!]! @cost(weight: "10")
  "All distinct projection types in the state table."
  adminProjectionTypes(module: String): [String!]! @cost(weight: "10")
  "Projection state rows filtered by type, tenant, and search term."
  adminProjectionStates(projectionType: String! tenant: String search: String module: String limit: Int! = 50): [ProjectionState!]! @cost(weight: "10")
  "Current tenant leases with store topology (single\/multi-tenant)."
  adminTenantLeases(module: String): TenantLeaseInventory! @cost(weight: "10")
  "Every tenant this module's store has seen an event for, ordered by ID. Empty on a single-tenant store. Unlike adminTenantLeases this does not depend on a consumer currently holding a lease, so it is the list to offer as a tenant filter."
  adminTenants(module: String): [String!]! @cost(weight: "10")
  "Active (non-expired) processor leases held for a specific processor."
  adminProcessorLeases(processorId: String! module: String): [ActiveProcessorLease!]! @cost(weight: "10")
  "Current maximum global position from this module's event log. Null if no events exist. Not comparable with another module's position."
  adminGlobalPosition(module: String): Long @cost(weight: "10")
  "Rebuild state for all projections, or for a single processor when processorId is supplied. Returns an empty list when no rebuild has ever been started."
  adminRebuildStates(processorId: String module: String): [RebuildStateInfo!]! @cost(weight: "10")
}

"Result of aborting a projection rebuild."
type RebuildAbortResult {
  processorId: String!
  status: String!
}

"Result of promoting a projection rebuild."
type RebuildPromoteResult {
  processorId: String!
  status: String!
}

"Result of starting a projection rebuild."
type RebuildStartResult {
  activeVersion: Int!
  rebuildingVersion: Int!
  targetPosition: Long!
}

"""
Rebuild state for a single projection as seen from the admin surface.

 is one of the lowercase strings idle, rebuilding,
ready, completed, or aborted.
 is one of promote, force-promote, abort,
or  when no operator action is pending.
"""
type RebuildStateInfo {
  processorId: String!
  projectionType: String!
  activeVersion: Int!
  rebuildingVersion: Int
  status: String!
  requestedAction: String
  replayedPosition: Long
  targetPosition: Long
  startedAt: DateTime
  completedAt: DateTime
}

"Result of a retry-by-rewind mutation."
type RetryByRewindMutationResult {
  processorId: String!
  rewindPosition: Long
  deletedCount: Int!
}

type Subscription {
  "Streams system info snapshots after admin mutations on the given module."
  onAdminSystemUpdated(module: String): SystemInfo! @cost(weight: "10")
  "Streams checkpoint updates after admin set\/reset operations on the given module."
  onAdminCheckpointUpdated(module: String): CheckpointMutationResult! @cost(weight: "10")
  "Streams dead letter changes after clear\/retry operations on the given module."
  onAdminDeadLettersChanged(module: String): DeadLetterClearResult! @cost(weight: "10")
  "Streams rebuild lifecycle events (started, promoted, aborted) on the given module."
  onAdminRebuildUpdated(module: String): AdminRebuildEvent! @cost(weight: "10")
  "Streams every admin audit event on the given module as it is appended to the event log."
  onAdminAuditEvent(module: String): AdminAuditEntry! @cost(weight: "10")
}

"Aggregate system stats."
type SystemInfo {
  globalPosition: Long
  processorCount: Long!
  deadLetterCount: Long!
  lastEventAt: DateTime
}

"Tenant lease inventory together with the store topology that gives an empty list meaning."
type TenantLeaseInventory {
  tenancyMode: AdminTenancyMode!
  leases: [AdminTenantLease!]!
}

"Result of releasing tenant leases."
type TenantLeaseReleaseResult {
  releasedCount: Int!
}

"Input for adding an item to an order."
input AddOrderItemInput {
  orderId: UUID!
  productId: UUID!
  productName: String!
  quantity: Int!
  unitPrice: Decimal!
}

"Input for cancelling an order."
input CancelOrderInput {
  orderId: UUID!
  reason: String!
}

"Input for capturing a payment."
input CapturePaymentInput {
  paymentId: UUID!
  amount: Decimal
}

"Input for creating an order."
input CreateOrderInput {
  customerId: UUID!
  lineItems: [OrderItemInput!]!
  notes: String
}

"Input for failing a payment."
input FailPaymentInput {
  paymentId: UUID!
  errorCode: String!
  errorMessage: String!
}

"Input for initiating a payment."
input InitiatePaymentInput {
  orderId: UUID!
  amount: Decimal!
  currency: String!
  paymentMethod: String!
}

"Input for order line items."
input OrderItemInput {
  productId: UUID!
  productName: String!
  quantity: Int!
  unitPrice: Decimal!
}

"Input for refunding a payment."
input RefundPaymentInput {
  paymentId: UUID!
  amount: Decimal!
  reason: String!
}

"Input for shipping an order."
input ShipOrderInput {
  orderId: UUID!
  trackingNumber: String!
  carrier: String!
}

"The tenancy shape of the migrated PostgreSQL store."
enum AdminTenancyMode {
  "The schema contains no tenant columns or tenant lease table."
  SINGLE_TENANT
  "The schema stores tenant identity and tenant leases."
  MULTI_TENANT
}

"Possible states of an order."
enum OrderStatus {
  NONE
  DRAFT
  CONFIRMED
  SHIPPED
  DELIVERED
  CANCELLED
}

"Possible states of a payment."
enum PaymentStatus {
  NONE
  INITIATED
  AUTHORIZED
  CAPTURED
  FAILED
  REFUNDED
}

"The purpose of the `cost` directive is to define a `weight` for GraphQL types, fields, and arguments. Static analysis can use these weights when calculating the overall cost of a query or response."
directive @cost("The `weight` argument defines what value to add to the overall cost for every appearance, or possible appearance, of a type, field, argument, etc." weight: String!) on SCALAR | OBJECT | FIELD_DEFINITION | ARGUMENT_DEFINITION | ENUM | INPUT_FIELD_DEFINITION

"The `@specifiedBy` directive is used within the type system definition language to provide a URL for specifying the behavior of custom scalar definitions."
directive @specifiedBy("The specifiedBy URL points to a human-readable specification. This field will only read a result for scalar types." url: String!) on SCALAR

"The `DateTime` scalar represents an ISO-8601 compliant date time type."
scalar DateTime @specifiedBy(url: "https:\/\/www.graphql-scalars.com\/date-time")

"The `Decimal` scalar type represents a decimal floating-point number."
scalar Decimal

"The `Long` scalar type represents non-fractional signed whole 64-bit numeric values. Long can represent values between -(2^63) and 2^63 - 1."
scalar Long

scalar UUID @specifiedBy(url: "https:\/\/tools.ietf.org\/html\/rfc4122")