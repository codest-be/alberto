<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    Alberto's package icon. The shape is the pitch: a fat append-only log, and one
    consistency boundary cutting clean through it. The boundary is not a stream or an
    aggregate the log was carved into up front — it is a query drawn across events that
    were already there, which is why it crosses every bar at an angle rather than
    following the way they are stacked.

    Styling follows CurioStack's design tokens, scaled up from component size to a 256px
    tile: the warm paper background #FAF8F3, the warm near-black foreground #090706 for
    the border and every outline, the logo yellow #F3CD00 as the single accent, a chunky
    small corner radius, and a hard offset shadow with zero blur. Nothing here uses a
    gradient or a soft shadow, on purpose. (Token names are spelled out rather than
    written with their CSS prefix because an XML comment may not contain a double hyphen.)

    icon.png is rendered from this file and is what actually ships, because NuGet accepts
    only PNG and JPEG. After editing, regenerate it:
      rsvg-convert -w 256 -h 256 icon.svg -o icon.png
  -->
  <defs>
    <!-- three events in the log, drawn once and reused for the fill and the shadow -->
    <g id="bars">
      <rect x="42" y="62"  width="172" height="38" rx="9"/>
      <rect x="42" y="109" width="172" height="38" rx="9"/>
      <rect x="42" y="156" width="172" height="38" rx="9"/>
    </g>

    <!-- The same three rects again. A clipPath may not reference a <g> through <use>, so
         this geometry has to be repeated rather than shared with #bars above; renderers
         resolve the invalid form to an empty clip and silently drop the boundary. -->
    <clipPath id="log">
      <rect x="42" y="62"  width="172" height="38" rx="9"/>
      <rect x="42" y="109" width="172" height="38" rx="9"/>
      <rect x="42" y="156" width="172" height="38" rx="9"/>
    </clipPath>

    <!-- The boundary. It runs well past the log at both ends so that the clip, not the
         polygon, decides where it starts and stops. -->
    <polygon id="blade" points="132,30 188,30 144,226 88,226"/>
  </defs>

  <rect x="5" y="5" width="246" height="246" rx="24" fill="#FAF8F3" stroke="#090706" stroke-width="10"/>

  <!-- hard offset shadow, zero blur -->
  <g transform="translate(7,7)"><use href="#bars" fill="#090706"/></g>

  <use href="#bars" fill="#FAF8F3" stroke="#090706" stroke-width="7"/>

  <!-- The boundary keeps its own outline where it crosses an event, so it reads as a cut
       through the log rather than a highlight laid over it. -->
  <g clip-path="url(#log)"><use href="#blade" fill="#F3CD00" stroke="#090706" stroke-width="7"/></g>
</svg>
