# This workflow publishes NuGet packages using GitVersion for automatic versioning

name: Publish NuGet Packages

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  publish:
    name: Build and Publish Packages
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: true
      DOTNET_GENERATE_ASPNET_CERTIFICATE: false
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: false
      DOTNET_MULTILEVEL_LOOKUP: 0
      DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true
      TERM: xterm

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for GitVersion

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v1.1.1
        with:
          versionSpec: '5.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v1.1.1

      - name: Start PostgreSQL 16
        run: |
          docker run --name postgres-test \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_DB=test \
            -p 5432:5432 \
            -d postgres:16

          # Wait for PostgreSQL to be ready
          timeout 30 bash -c 'until docker exec postgres-test pg_isready -U postgres; do sleep 1; done'

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Display Version Information
        run: |
          echo "Version: ${{ steps.gitversion.outputs.nuGetVersionV2 }}"
          echo "Semantic Version: ${{ steps.gitversion.outputs.semVer }}"
          echo "Branch Name: ${{ steps.gitversion.outputs.branchName }}"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore /p:Version=${{ steps.gitversion.outputs.nuGetVersionV2 }}

      - name: Run tests
        run: dotnet test tst/Alberto.EventStore.Tests/Alberto.EventStore.Tests.csproj --no-restore --no-build --configuration Release
        env:
          POSTGRES_CONNECTION_STRING: "Host=localhost;Port=5432;Database=test;Username=postgres;Password=postgres"

      - name: Create NuGet packages
        run: dotnet pack --configuration Release --no-build --output ./artifacts/packages

 #     - name: Publish packages to NuGet.org
 #       run: |
 #         for package in ./artifacts/packages/*.nupkg; do
 #           echo "Publishing $package"
 #           dotnet nuget push "$package" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
 #         done

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/packages/*.nupkg
          retention-days: 90