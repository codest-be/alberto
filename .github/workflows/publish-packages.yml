name: Publish NuGet Packages

on:
  push:
    # Branch pushes publish a prerelease to GitHub Packages only; nuget.org steps need a tag.
    branches: [main, 'release/**']
    tags: ['v*']

  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Version suffix (e.g. beta.1, beta.2). Leave empty to use run number.'
        required: false
        type: string

# No `paths` filter: it would also apply to tag pushes and silently skip a release tag.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    # The release PR's squash merge ("Release X.Y.Z (#N)", titled by release.yml) is about to be tagged,
    # and the tag run builds and tests the same commit: skip its beta. Prefix match only (expressions
    # have no regex), so any other merge titled "Release ..." loses its beta too; the next push has one.
    if: ${{ !(github.event_name == 'push' && github.ref_type == 'branch' && startsWith(github.event.head_commit.message, 'Release ')) }}
    # release-ci, not public-ci: this job holds publishing credentials and must never share a machine
    # account with the runner that builds contributor code. Nothing here checks out a pull request.
    runs-on: [self-hosted, release-ci]
    # A stop for a wedged job, not a budget (~6 min in practice).
    timeout-minutes: 60
    permissions:
      packages: write
      contents: read
      id-token: write   # required by NuGet/login for trusted publishing

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No actions/setup-dotnet (as in ci.yml): the host SDK is root-owned; there is no global.json.

      # A tag must equal VersionPrefix (the single source of truth); anything else is a prerelease.
      - name: Determine version
        id: version
        env:
          INPUT_VERSION_SUFFIX: ${{ inputs.version_suffix }}
        run: |
          PREFIX=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props | head -1)
          if [ -z "$PREFIX" ]; then
            echo "::error::Could not read <VersionPrefix> from Directory.Build.props"
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$PREFIX" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match <VersionPrefix>${PREFIX}</VersionPrefix>. Update Directory.Build.props or retag."
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "suffix=" >> "$GITHUB_OUTPUT"
            echo "Release version: $PREFIX"
          else
            SUFFIX="$INPUT_VERSION_SUFFIX"
            if [ -z "$SUFFIX" ]; then
              SUFFIX="beta.${{ github.run_number }}"
            fi
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
            echo "Prerelease version: $PREFIX-$SUFFIX"
          fi

      # The packable set is read from .github/packages.txt so it cannot drift from what Pack
      # below actually packs.
      - name: Build libraries
        run: |
          PROJECTS=()
          while IFS= read -r proj; do PROJECTS+=("$proj"); done \
            < <(grep -vE '^\s*(#|$)' .github/packages.txt)
          [ ${#PROJECTS[@]} -gt 0 ] || { echo "::error::.github/packages.txt lists no packages"; exit 1; }
          for proj in "${PROJECTS[@]}"; do
            dotnet build "src/$proj/$proj.csproj" -c Release
          done

      # Includes Testcontainers tests: this runner needs its own rootless Docker daemon.
      - name: Test
        run: dotnet test tests/Alberto.Tests/Alberto.Tests.csproj -c Release

      - name: Pack
        run: |
          # Empty output dir: "Verify packed set" lists it, so a stale .nupkg must not satisfy the allowlist.
          rm -rf artifacts
          SUFFIX_ARG=""
          if [ -n "${{ steps.version.outputs.suffix }}" ]; then
            SUFFIX_ARG="--version-suffix ${{ steps.version.outputs.suffix }}"
          fi
          # Collect into an array first: dotnet inside `while read` eats stdin. No mapfile: bash 3.2.
          PROJECTS=()
          while IFS= read -r proj; do PROJECTS+=("$proj"); done \
            < <(grep -vE '^\s*(#|$)' .github/packages.txt)
          [ ${#PROJECTS[@]} -gt 0 ] || { echo "::error::.github/packages.txt lists no packages"; exit 1; }
          for proj in "${PROJECTS[@]}"; do
            dotnet pack "src/$proj/$proj.csproj" -c Release --no-build $SUFFIX_ARG -o artifacts
          done

      # Hand-written allowlist, deliberately NOT read from .github/packages.txt: it must be an independent
      # second statement of what ships (nuget.org IDs can be unlisted, never deleted). Adding a package
      # costs two edits on purpose. Whole-ID diff, not prefix match.
      - name: Verify packed set
        run: |
          # RUNNER_TEMP: the runner is persistent; a fixed /tmp path could leak between runs.
          TMP="${RUNNER_TEMP:-/tmp}"
          cat > "$TMP/expected-packages.txt" <<'IDS'
          Alberto
          Alberto.Commands
          Alberto.EntityFramework
          Alberto.InMemory
          Alberto.Messaging
          Alberto.Messaging.Postgres
          Alberto.Postgres
          Alberto.Telemetry
          Alberto.Testing
          Alberto.Testing.Xunit
          IDS
          LC_ALL=C sort -o "$TMP/expected-packages.txt" "$TMP/expected-packages.txt"

          # Strip semver and extension to recover the ID (no Alberto ID ends in a number).
          ls artifacts/*.nupkg \
            | xargs -n1 basename \
            | sed -E 's/\.[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\.nupkg$//' \
            | LC_ALL=C sort -u > "$TMP/actual-packages.txt"

          echo "Packed:"; cat "$TMP/actual-packages.txt"

          if ! diff -u "$TMP/expected-packages.txt" "$TMP/actual-packages.txt"; then
            echo "::error::Packed set does not match the allowlist. '-' lines are missing packages, '+' lines are packages that must never be published."
            exit 1
          fi

      # Persistent runner: the user-level NuGet.config outlives the job, so remove any stale `github`
      # source first (add fails on an existing name); the token is stored in clear text and removed below.
      - name: Add GitHub Packages source
        run: |
          dotnet nuget remove source github >/dev/null 2>&1 || true
          dotnet nuget add source "https://nuget.pkg.github.com/codest-be/index.json" \
            --name github \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text

      - name: Push libraries to GitHub Packages
        run: dotnet nuget push "artifacts/Alberto*.nupkg" --source github --skip-duplicate --timeout 600

      # Best-effort: a failed .snupkg push must not fail a run whose packages already landed.
      - name: Push symbols to GitHub Packages
        if: always()
        run: dotnet nuget push "artifacts/*.snupkg" --source github --skip-duplicate --timeout 600 || true

      # always(): a failed push must still remove the stored token.
      - name: Remove GitHub Packages source
        if: always()
        run: dotnet nuget remove source github >/dev/null 2>&1 || true

      # Trusted publishing: the policy on nuget.org is bound to this workflow's filename, so renaming it breaks publishing.
      # NUGET_USER is the nuget.org profile name, not an email.
      - name: Log in to nuget.org
        id: nuget-login
        if: steps.version.outputs.release == 'true'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Runs only behind the "Verify packed set" allowlist. nuget.org pushes are permanent:
      # a package can be unlisted but never deleted, and the ID is never reclaimable.
      # .snupkg files sitting next to their .nupkg are uploaded automatically.
      - name: Push to nuget.org
        if: steps.version.outputs.release == 'true'
        run: |
          dotnet nuget push "artifacts/Alberto*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate \
            --timeout 600
