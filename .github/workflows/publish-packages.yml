name: Publish NuGet Packages

on:
  push:
    # A push to either branch publishes a prerelease to GitHub Packages only; the nuget.org
    # steps are gated on the ref being a tag. Release branches are included so a backport can
    # be smoke-tested from a real feed before it is tagged.
    branches: [main, 'release/**']
    tags: ['v*']

  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Version suffix (e.g. beta.1, beta.2). Leave empty to use run number.'
        required: false
        type: string

# No `paths` filter: GitHub applies path filters to tag pushes too, so a release tag on a
# commit that happened not to touch src/** would be skipped without a word. A few extra
# prerelease builds are cheaper than a release that silently does not happen.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write   # required by NuGet/login for trusted publishing

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # A tag publishes the release version verbatim; anything else publishes a prerelease.
      # The tag must agree with VersionPrefix, which is the single source of truth — a tag
      # that disagrees is a mistake worth failing on, not a version worth guessing at.
      - name: Determine version
        id: version
        run: |
          PREFIX=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props | head -1)
          if [ -z "$PREFIX" ]; then
            echo "::error::Could not read <VersionPrefix> from Directory.Build.props"
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$PREFIX" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match <VersionPrefix>${PREFIX}</VersionPrefix>. Update Directory.Build.props or retag."
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "suffix=" >> "$GITHUB_OUTPUT"
            echo "Release version: $PREFIX"
          else
            SUFFIX="${{ inputs.version_suffix }}"
            if [ -z "$SUFFIX" ]; then
              SUFFIX="beta.${{ github.run_number }}"
            fi
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
            echo "Prerelease version: $PREFIX-$SUFFIX"
          fi

      # The packable set is read from .github/packages.txt so it cannot drift from what Pack
      # below actually packs. The three projects named after the loop are built but never
      # packed: the admin surface is IsPackable=false until the front doors on
      # feature/admin-surface ship, and the CLI is a tool rather than a package. Building them
      # here still catches a Release compile break, which the pack loop would not.
      - name: Build libraries
        run: |
          PROJECTS=()
          while IFS= read -r proj; do PROJECTS+=("$proj"); done \
            < <(grep -vE '^\s*(#|$)' .github/packages.txt)
          [ ${#PROJECTS[@]} -gt 0 ] || { echo "::error::.github/packages.txt lists no packages"; exit 1; }
          for proj in "${PROJECTS[@]}"; do
            dotnet build "src/$proj/$proj.csproj" -c Release
          done
          dotnet build src/Alberto.Admin/Alberto.Admin.csproj -c Release
          dotnet build src/Alberto.Admin.Postgres/Alberto.Admin.Postgres.csproj -c Release
          dotnet build tools/Alberto.Cli/Alberto.Cli.csproj -c Release

      - name: Test
        run: dotnet test tests/Alberto.Tests/Alberto.Tests.csproj -c Release

      - name: Pack
        run: |
          SUFFIX_ARG=""
          if [ -n "${{ steps.version.outputs.suffix }}" ]; then
            SUFFIX_ARG="--version-suffix ${{ steps.version.outputs.suffix }}"
          fi
          # The list is collected into an array before any dotnet runs. Calling dotnet directly
          # in a `while read` body would let it inherit the loop's stdin and eat the rest of the
          # list. `mapfile` would say this in one line but does not exist in bash 3.2, which is
          # what macOS ships — this form lets a maintainer run the loop locally.
          PROJECTS=()
          while IFS= read -r proj; do PROJECTS+=("$proj"); done \
            < <(grep -vE '^\s*(#|$)' .github/packages.txt)
          [ ${#PROJECTS[@]} -gt 0 ] || { echo "::error::.github/packages.txt lists no packages"; exit 1; }
          for proj in "${PROJECTS[@]}"; do
            dotnet pack "src/$proj/$proj.csproj" -c Release --no-build $SUFFIX_ARG -o artifacts
          done

      # The only thing standing between an accidental IsPackable=true and a permanent
      # nuget.org listing. Compares packed IDs against a literal allowlist and fails on any
      # difference in either direction: an unexpected package, or one that stopped building.
      # The comparison is whole-ID, not prefix: `Alberto.Messaging` is a prefix of
      # `Alberto.Messaging.Postgres`, so a substring test would admit an unexpected
      # `Alberto.Messaging.Something`. Sorted `diff` cannot.
      # `artifacts/*.nupkg` does not match `.snupkg` — that suffix has no dot before "nupkg".
      #
      # This list is written out by hand ON PURPOSE. Every other enumeration of the packable
      # set — Build libraries and Pack above, Pack smoke in ci.yml — now reads
      # .github/packages.txt; this one does not, and must not. Its value is that it is an
      # *independent* second statement of what ships. Sourcing it from packages.txt would make
      # the step ask "did dotnet pack produce what the loop just asked for?", which is a
      # tautology: one line added to one file would then both pack a new package and bless it.
      #
      # CODEOWNERS is not an alternative. /.github/ is already owned, and the rulesets require
      # zero approvals because GitHub will not let this repository's sole maintainer approve
      # their own pull request (see .github/CODEOWNERS). Ownership requests review here; it does
      # not gate. Swapping a hard gate for an advisory one is the wrong trade when the failure
      # mode is a nuget.org ID that can be unlisted but never deleted or reclaimed.
      #
      # Nothing drifts quietly regardless: an entry added to packages.txt but not here makes
      # Pack produce an extra .nupkg, which lands as a `+` line in the diff below and fails the
      # job before any push. So publishing a new package costs two edits in two files. That is
      # the intended speed bump on an irreversible action, not an oversight — please leave it.
      - name: Verify packed set
        run: |
          cat > /tmp/expected-packages.txt <<'IDS'
          Alberto
          Alberto.Commands
          Alberto.EntityFramework
          Alberto.InMemory
          Alberto.Messaging
          Alberto.Messaging.Postgres
          Alberto.Postgres
          Alberto.Telemetry
          Alberto.Testing
          Alberto.Testing.Xunit
          IDS
          LC_ALL=C sort -o /tmp/expected-packages.txt /tmp/expected-packages.txt

          # Strip a trailing semver and the extension to recover the package ID. No Alberto
          # package ID ends in a numeric segment, so this is unambiguous.
          ls artifacts/*.nupkg \
            | xargs -n1 basename \
            | sed -E 's/\.[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\.nupkg$//' \
            | LC_ALL=C sort -u > /tmp/actual-packages.txt

          echo "Packed:"; cat /tmp/actual-packages.txt

          if ! diff -u /tmp/expected-packages.txt /tmp/actual-packages.txt; then
            echo "::error::Packed set does not match the allowlist. '-' lines are missing packages, '+' lines are packages that must never be published."
            exit 1
          fi

      - name: Add GitHub Packages source
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/codest-be/index.json" \
            --name github \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text

      - name: Push libraries to GitHub Packages
        run: dotnet nuget push "artifacts/Alberto*.nupkg" --source github --skip-duplicate --timeout 600

      # Symbols are best-effort: a failed .snupkg push must not fail a run whose packages
      # already landed. `if: always()` keeps this reachable after an earlier step fails, and
      # `|| true` keeps the step itself green.
      - name: Push symbols to GitHub Packages
        if: always()
        run: dotnet nuget push "artifacts/*.snupkg" --source github --skip-duplicate --timeout 600 || true

      # Trusted publishing: the OIDC token this job is allowed to mint is exchanged for a
      # nuget.org API key valid for one hour. No long-lived key is stored anywhere. The
      # policy on nuget.org is bound to this repository AND this workflow filename — renaming
      # this file breaks publishing until the policy is edited to match.
      # NUGET_USER is the nuget.org profile name, not an email address.
      - name: Log in to nuget.org
        id: nuget-login
        if: steps.version.outputs.release == 'true'
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Runs only behind the "Verify packed set" allowlist. nuget.org pushes are permanent:
      # a package can be unlisted but never deleted, and the ID is never reclaimable.
      # .snupkg files sitting next to their .nupkg are uploaded automatically.
      - name: Push to nuget.org
        if: steps.version.outputs.release == 'true'
        run: |
          dotnet nuget push "artifacts/Alberto*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate \
            --timeout 600
