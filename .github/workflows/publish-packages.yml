name: Publish NuGet Packages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/publish-packages.yml'

  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Version suffix (e.g. beta.1, beta.2). Leave empty to use run number.'
        required: false
        type: string

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        id: version
        run: |
          SUFFIX="${{ inputs.version_suffix }}"
          if [ -z "$SUFFIX" ]; then
            SUFFIX="beta.${{ github.run_number }}"
          fi
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "Version suffix: $SUFFIX"

      - name: Build libraries
        run: |
          dotnet build src/Alberto.Dcb/Alberto.Dcb.csproj -c Release
          dotnet build src/Alberto.Dcb.Commands/Alberto.Dcb.Commands.csproj -c Release
          dotnet build src/Alberto.Dcb.EntityFramework/Alberto.Dcb.EntityFramework.csproj -c Release
          dotnet build src/Alberto.Dcb.InMemory/Alberto.Dcb.InMemory.csproj -c Release
          dotnet build src/Alberto.Dcb.Messaging/Alberto.Dcb.Messaging.csproj -c Release
          dotnet build src/Alberto.Dcb.Postgres/Alberto.Dcb.Postgres.csproj -c Release
          dotnet build src/Alberto.Dcb.Telemetry/Alberto.Dcb.Telemetry.csproj -c Release
          dotnet build tools/Alberto.Cli/Alberto.Cli.csproj -c Release

      - name: Test
        run: dotnet test tests/Alberto.Dcb.Tests/Alberto.Dcb.Tests.csproj -c Release

      - name: Pack
        run: |
          VERSION_SUFFIX="${{ steps.version.outputs.suffix }}"
          for proj in Alberto.Dcb Alberto.Dcb.Commands Alberto.Dcb.EntityFramework Alberto.Dcb.InMemory Alberto.Dcb.Messaging Alberto.Dcb.Postgres Alberto.Dcb.Telemetry; do
            dotnet pack "src/$proj/$proj.csproj" -c Release --no-build --version-suffix "$VERSION_SUFFIX" -o artifacts
          done
          dotnet pack tools/Alberto.Cli/Alberto.Cli.csproj -c Release --no-build --version-suffix "$VERSION_SUFFIX" -o artifacts

      - name: Push to GitHub Packages
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/codest-be/index.json" \
            --name github \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text
          dotnet nuget push "artifacts/*.nupkg" --source github --skip-duplicate
          dotnet nuget push "artifacts/*.snupkg" --source github --skip-duplicate || true
