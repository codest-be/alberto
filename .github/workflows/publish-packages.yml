name: Publish NuGet Packages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/publish-packages.yml'

  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Version suffix (e.g. beta.1, beta.2). Leave empty to use run number.'
        required: false
        type: string

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        id: version
        run: |
          SUFFIX="${{ inputs.version_suffix }}"
          if [ -z "$SUFFIX" ]; then
            SUFFIX="beta.${{ github.run_number }}"
          fi
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "Version suffix: $SUFFIX"

      - name: Build libraries
        run: |
          dotnet build src/Alberto.Dcb/Alberto.Dcb.csproj -c Release
          # Built but deliberately not packed: the admin surface is IsPackable=false until the
          # front doors on feature/admin-surface ship. Building it here still catches a Release
          # compile break, which the pack loop below no longer would.
          dotnet build src/Alberto.Dcb.Admin/Alberto.Dcb.Admin.csproj -c Release
          dotnet build src/Alberto.Dcb.Postgres.Admin/Alberto.Dcb.Postgres.Admin.csproj -c Release
          dotnet build src/Alberto.Dcb.Commands/Alberto.Dcb.Commands.csproj -c Release
          dotnet build src/Alberto.Dcb.EntityFramework/Alberto.Dcb.EntityFramework.csproj -c Release
          dotnet build src/Alberto.Dcb.InMemory/Alberto.Dcb.InMemory.csproj -c Release
          dotnet build src/Alberto.Dcb.Messaging/Alberto.Dcb.Messaging.csproj -c Release
          dotnet build src/Alberto.Dcb.Postgres/Alberto.Dcb.Postgres.csproj -c Release
          dotnet build src/Alberto.Dcb.Postgres.Messaging/Alberto.Dcb.Postgres.Messaging.csproj -c Release
          dotnet build src/Alberto.Dcb.Telemetry/Alberto.Dcb.Telemetry.csproj -c Release
          dotnet build src/Alberto.Dcb.Testing/Alberto.Dcb.Testing.csproj -c Release
          dotnet build src/Alberto.Dcb.Testing.Xunit/Alberto.Dcb.Testing.Xunit.csproj -c Release
          dotnet build tools/Alberto.Cli/Alberto.Cli.csproj -c Release

      - name: Test
        run: dotnet test tests/Alberto.Dcb.Tests/Alberto.Dcb.Tests.csproj -c Release

      - name: Pack
        run: |
          VERSION_SUFFIX="${{ steps.version.outputs.suffix }}"
          for proj in Alberto.Dcb Alberto.Dcb.Commands Alberto.Dcb.EntityFramework Alberto.Dcb.InMemory Alberto.Dcb.Messaging Alberto.Dcb.Postgres Alberto.Dcb.Postgres.Messaging Alberto.Dcb.Telemetry Alberto.Dcb.Testing Alberto.Dcb.Testing.Xunit; do
            dotnet pack "src/$proj/$proj.csproj" -c Release --no-build --version-suffix "$VERSION_SUFFIX" -o artifacts
          done
          dotnet pack tools/Alberto.Cli/Alberto.Cli.csproj -c Release --no-build --version-suffix "$VERSION_SUFFIX" -o artifacts

      - name: Add GitHub Packages source
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/codest-be/index.json" \
            --name github \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text

      - name: Push libraries to GitHub Packages
        run: dotnet nuget push "artifacts/Alberto.Dcb*.nupkg" --source github --skip-duplicate --timeout 600

      # The CLI push hangs against nuget.pkg.github.com often enough to have failed
      # 14 of runs 64-88. The hang is not slowness: a healthy push of this package
      # finishes in 6-8s, while every failure sat at the timeout (603-604s) and died.
      # Raising the timeout therefore buys nothing — only a fresh connection does.
      # Fail fast at 60s (~8x the observed healthy time) and retry, backing off
      # further each attempt because the failures arrive in clusters.
      - name: Push CLI to GitHub Packages
        run: |
          for attempt in 1 2 3 4 5; do
            if dotnet nuget push "artifacts/Alberto.Cli*.nupkg" \
                 --source github --skip-duplicate --timeout 60; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              backoff=$((attempt * 15))
              echo "::warning::CLI push attempt $attempt failed; retrying in ${backoff}s"
              sleep "$backoff"
            fi
          done
          echo "::error::CLI push failed after 5 attempts"
          exit 1

      # Symbols are best-effort, but they used to be skipped entirely whenever the
      # CLI push failed: these were one step, and GitHub runs `run:` under `bash -e`.
      - name: Push symbols to GitHub Packages
        if: always()
        run: dotnet nuget push "artifacts/*.snupkg" --source github --skip-duplicate --timeout 600 || true
