name: Benchmarks

on:
  schedule:
    # 02:00 UTC daily. PR CI stays fast; this is where the real suite runs.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      categories:
        description: 'Category filter (append, query, or leave blank for all)'
        required: false
        default: ''

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Names the profile directory. The hash still distinguishes the actual hardware.
  ALBERTO_BENCH_PROFILE_LABEL: ci

jobs:
  # Self-hosted so runs share hardware, but other runner services share the host: re-run a surprising
  # delta before believing it. The single public-ci runner is occupied for the whole run (PR CI queues).
  benchmark:
    runs-on: [self-hosted, public-ci]
    # Measures only; the write token lives in publish-history so none sits on the PR-building box.
    permissions:
      contents: read
    # Seeding 1M events plus ~80 cases.
    timeout-minutes: 120
    outputs:
      profile: ${{ steps.profile.outputs.id }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No actions/setup-dotnet: see ci.yml.

      - name: Run benchmarks
        env:
          # Via env so a dispatch input is data, never shell syntax.
          CATEGORIES: ${{ github.event.inputs.categories }}
        run: |
          # BenchmarkSwitcher prompts without a filter, so default to '--filter *'. Keep the glob quoted
          # and the args an array, or the shell expands it against the repo root.
          if [ -n "$CATEGORIES" ]; then
            FILTER=(--anyCategories="$CATEGORIES")
          else
            FILTER=(--filter '*')
          fi
          dotnet run -c Release --project benchmarks/Alberto.Benchmarks -- "${FILTER[@]}"

          # A filter matching nothing exits 0 in BenchmarkSwitcher; catch it here.
          if [ ! -d BenchmarkDotNet.Artifacts/results ]; then
            echo "The benchmark run produced no results directory. See the output above:" >&2
            echo "the filter most likely matched no benchmarks." >&2
            exit 1
          fi

      # Passes the whole results directory: the run spans several benchmark classes and
      # BenchmarkDotNet writes one report per class.
      - name: Normalize results
        run: |
          dotnet run -c Release --project benchmarks/Alberto.Benchmarks.Compare -- \
            --import BenchmarkDotNet.Artifacts/results \
            --out candidate.json \
            --git-sha "${{ github.sha }}" \
            --postgres-image "postgres:16-alpine"

      - name: Resolve profile id
        id: profile
        run: |
          PROFILE=$(python3 -c "import json;print(json.load(open('candidate.json'))['run']['profileId'])")
          echo "id=$PROFILE" >> "$GITHUB_OUTPUT"

      - name: Compare against baseline
        id: compare
        continue-on-error: true
        run: |
          dotnet run -c Release --project benchmarks/Alberto.Benchmarks.Compare -- \
            --baseline "benchmarks/results/${{ steps.profile.outputs.id }}/baseline.json" \
            --candidate candidate.json \
            --markdown delta.md

      # First run for a profile seeds a baseline and writes no delta; that is success.
      - name: Publish delta to the job summary
        if: always()
        run: |
          if [ -f delta.md ]; then
            cat delta.md >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.compare.outcome }}" = "success" ]; then
            echo "No delta: this profile had no baseline, so this run seeded one." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No delta: the compare tool failed before writing one. See the step log." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Also the hand-off to publish-history.
      - name: Upload raw reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmark-reports
          path: |
            BenchmarkDotNet.Artifacts/results/
            candidate.json

      # Compare exits 1 on regression and 2 on its own errors; both fail the job, with distinct messages.
      - name: Fail if a regression was detected
        if: steps.compare.outcome == 'failure'
        run: |
          if [ -f delta.md ]; then
            echo "Benchmark regression detected. See the job summary." >&2
          else
            echo "The comparison tool failed. See the 'Compare against baseline' step log." >&2
          fi
          exit 1

  # Separate job on release-ci (no contributor code) so the repository-write token never shares a box
  # with PR builds. The hand-off is an artifact because the two runners cannot read each other's home.
  publish-history:
    needs: benchmark
    # always(): a regression is a result worth recording. The profile guard skips runs that died before candidate.json.
    if: always() && github.event_name == 'schedule' && needs.benchmark.outputs.profile != ''
    runs-on: [self-hosted, release-ci]
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the run's results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: benchmark-reports
          path: incoming

      # baseline.json is only ever moved by a human running `--accept`; auto-promotion would ratchet silently.
      - name: Append to history
        run: |
          # upload-artifact only warns on a missing path; commit nothing rather than report a publish failure.
          if [ ! -f incoming/candidate.json ]; then
            echo "No candidate.json in the artifact — the benchmark run produced no result." >&2
            exit 0
          fi
          DIR="benchmarks/results/${{ needs.benchmark.outputs.profile }}/history"
          mkdir -p "$DIR"
          cp incoming/candidate.json "$DIR/$(date -u +%Y-%m-%dT%H-%MZ)-${GITHUB_SHA::7}.json"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$DIR"
          git diff --staged --quiet || git commit -m "chore(benchmarks): nightly result [skip ci]"
          git push
