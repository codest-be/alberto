name: Benchmarks

on:
  schedule:
    # 02:00 UTC daily. PR CI stays fast; this is where the real suite runs.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      categories:
        description: 'Category filter (append, query, or leave blank for all)'
        required: false
        default: ''

permissions:
  contents: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Names the profile directory. The hash still distinguishes the actual hardware.
  ALBERTO_BENCH_PROFILE_LABEL: ci

jobs:
  benchmark:
    # Self-hosted is a genuine improvement here rather than just consistency with the other
    # workflows: a hosted runner is different rented hardware every run, which is why the profile
    # is keyed by a hardware hash. Three fixed machines make consecutive runs comparable — though
    # the hash still separates them, since runner-1 and runner-3 are not required to be identical.
    runs-on: self-hosted
    # Seeding 1M events plus ~80 cases; the default 6h cap is far too generous to rely on.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run benchmarks
        env:
          # Read through the environment rather than interpolated into the script, so a
          # dispatch input is data and never shell syntax.
          CATEGORIES: ${{ github.event.inputs.categories }}
        run: |
          # BenchmarkSwitcher prompts interactively when given no filter at all, so a
          # scheduled run with no category input would sit at a menu instead of
          # benchmarking. '--filter *' is how you say "everything" non-interactively.
          # The glob has to stay quoted and the arguments have to travel as an array:
          # unquoted, the shell expands '*' against the repo root and BenchmarkDotNet
          # receives 'AGENTS.md', 'apps', 'src', ... which matches no benchmark at all.
          if [ -n "$CATEGORIES" ]; then
            FILTER=(--anyCategories="$CATEGORIES")
          else
            FILTER=(--filter '*')
          fi
          dotnet run -c Release --project benchmarks/Alberto.Benchmarks -- "${FILTER[@]}"

          # A filter that matches nothing is not an error to BenchmarkSwitcher — it prints
          # suggestions and exits 0. Without this check the run reports success and the
          # failure only surfaces two steps later as an unexplained missing directory.
          if [ ! -d BenchmarkDotNet.Artifacts/results ]; then
            echo "The benchmark run produced no results directory. See the output above:" >&2
            echo "the filter most likely matched no benchmarks." >&2
            exit 1
          fi

      # Passes the whole results directory: the run spans several benchmark classes and
      # BenchmarkDotNet writes one report per class.
      - name: Normalize results
        run: |
          dotnet run -c Release --project benchmarks/Alberto.Benchmarks.Compare -- \
            --import BenchmarkDotNet.Artifacts/results \
            --out candidate.json \
            --git-sha "${{ github.sha }}" \
            --postgres-image "postgres:16-alpine"

      - name: Resolve profile id
        id: profile
        run: |
          PROFILE=$(python3 -c "import json;print(json.load(open('candidate.json'))['run']['profileId'])")
          echo "id=$PROFILE" >> "$GITHUB_OUTPUT"

      - name: Compare against baseline
        id: compare
        continue-on-error: true
        run: |
          dotnet run -c Release --project benchmarks/Alberto.Benchmarks.Compare -- \
            --baseline "benchmarks/results/${{ steps.profile.outputs.id }}/baseline.json" \
            --candidate candidate.json \
            --markdown delta.md

      # On the very first run for a profile there is no baseline to diff against, so the
      # compare tool seeds one and writes no delta. That is a success, not a missing file.
      - name: Publish delta to the job summary
        if: always()
        run: |
          if [ -f delta.md ]; then
            cat delta.md >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.compare.outcome }}" = "success" ]; then
            echo "No delta: this profile had no baseline, so this run seeded one." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No delta: the compare tool failed before writing one. See the step log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload raw reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: |
            BenchmarkDotNet.Artifacts/results/
            candidate.json

      # History accumulates automatically; baseline.json is only ever moved by a human
      # running `--accept`. An auto-promoting baseline ratchets silently and stops being a gate.
      - name: Append to history
        if: github.event_name == 'schedule'
        run: |
          DIR="benchmarks/results/${{ steps.profile.outputs.id }}/history"
          mkdir -p "$DIR"
          cp candidate.json "$DIR/$(date -u +%Y-%m-%dT%H-%MZ)-${GITHUB_SHA::7}.json"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$DIR"
          git diff --staged --quiet || git commit -m "chore(benchmarks): nightly result [skip ci]"
          git push

      # The compare step fails on a regression (exit 1) and on its own errors (exit 2).
      # Both must fail the job, but saying "regression" for a crashed tool sends whoever
      # reads this at 2am hunting a slowdown that never happened.
      - name: Fail if a regression was detected
        if: steps.compare.outcome == 'failure'
        run: |
          if [ -f delta.md ]; then
            echo "Benchmark regression detected. See the job summary." >&2
          else
            echo "The comparison tool failed. See the 'Compare against baseline' step log." >&2
          fi
          exit 1
