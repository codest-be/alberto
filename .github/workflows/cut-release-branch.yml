name: Cut release branch

# Creates a `release/X.Y` branch from `main` so an older line can be patched. Cut it when `main` is about
# to move past a line you still intend to patch.

on:
  workflow_dispatch:
    inputs:
      line:
        description: 'Release line, MAJOR.MINOR (e.g. 1.0). Creates release/1.0.'
        required: true
        type: string

jobs:
  cut:
    # release-ci: a self-hosted group whose runner user runs no contributor code. workflow_dispatch
    # from a protected branch is the only way in.
    runs-on: [self-hosted, release-ci]
    # A branch push and nothing else.
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      # RELEASE_TOKEN: the ruleset forbids creating `release/**` to all but org admins and cannot exempt
      # the Actions app. See docs/releasing.md.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Cut
        env:
          LINE: ${{ inputs.line }}
        run: |
          if ! [[ "$LINE" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::\`$LINE\` is not a MAJOR.MINOR release line. Use e.g. 1.0, not v1.0 or 1.0.0."
            exit 1
          fi

          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error::Release branches are cut from \`main\`, not \`${GITHUB_REF_NAME}\`."
            exit 1
          fi

          BRANCH="release/$LINE"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::error::\`$BRANCH\` already exists. A release line is cut once."
            exit 1
          fi

          # The line must match main's VersionPrefix, or resolve-version.sh would reject every milestone on the new branch.
          CURRENT=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props | head -1)
          CURRENT_LINE="${CURRENT%.*}"

          if [ "$CURRENT_LINE" != "$LINE" ]; then
            echo "::error::\`main\` is on $CURRENT (line $CURRENT_LINE), so it cannot be the base for \`$BRANCH\`. Cut a release line before main moves past it."
            exit 1
          fi

          git push origin "HEAD:refs/heads/$BRANCH"

          {
            echo "## Cut \`$BRANCH\`"
            echo
            echo "From \`main\` at \`$(git rev-parse --short HEAD)\` (version $CURRENT)."
            echo
            echo "Fixes for this line go on \`main\` first, then get backported — run the"
            echo "**Backport** workflow, or label the merged pull request \`backport/$LINE\`."
            echo
            echo "Protect it: add \`$BRANCH\` to the release-branch ruleset if it is not already"
            echo "covered by the \`release/**\` pattern."
          } >> "$GITHUB_STEP_SUMMARY"
