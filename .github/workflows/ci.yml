name: CI

on:
  pull_request:
  push:
    # release/** is a maintained line, not an archive: backports land there and are tagged from
    # there, so it has to be as green as main.
    branches: [main, 'release/**']

# Read-only is already the repository default, so this changes nothing today. It is written out
# because it stopped being a detail: this workflow builds pull-request code on a persistent
# machine, and the default is a setting someone can widen for an unrelated reason in a UI far
# away from here. Stating it means that change cannot reach this job silently.
permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# There is one runner in the public-ci group, so runs queue behind each other instead of
# fanning out. Superseding a PR's own in-flight run is therefore worth much more here than it
# was on hosted runners: three pushes in a minute used to cost three parallel machines and now
# cost one runner three times over, delaying everybody else's PR.
# Pushes to main and release/** are exempt — every commit on a maintained line gets its own
# verdict, and cancelling one leaves a commit nobody ever built.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    # Self-hosted: the host carries the SDK and a Docker daemon, which took this job from
    # ~9m30s on ubuntu-latest to ~1m40s. The public-ci label is not decoration — it is a
    # runner group serving this repository alone, on a user with no docker-group membership
    # and its own rootless daemon, because CI on a public repo executes contributor code.
    runs-on: [self-hosted, public-ci]
    # The default is 6 hours. On a shared hosted runner that only wasted GitHub's capacity;
    # on a single self-hosted runner a wedged job blocks every other PR for the whole window.
    # The job takes under two minutes, so this is a stop, not a budget.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # No actions/setup-dotnet: the runner already carries the 10.0 SDK at /usr/share/dotnet,
      # which is root-owned while jobs run unprivileged. setup-dotnet resolves '10.0.x' to the
      # newest patch and then fails copying into that tree, so *asking* for the SDK is what
      # breaks the job. Installing to a writable directory instead would re-download the SDK
      # every run and give back most of the time this move was for. There is no global.json,
      # so the host's newest SDK is what builds; `dotnet --list-sdks` on the host is where to
      # change it.

      # Building the test project restores and compiles every referenced library
      # (Alberto, Alberto.Postgres, Alberto.InMemory, ...). The app /
      # Aspire host projects are intentionally excluded — they require the Aspire
      # workload and are not exercised by these tests.
      - name: Build
        run: dotnet build tests/Alberto.Tests/Alberto.Tests.csproj -c Release

      # reportgenerator, from .config/dotnet-tools.json. build/coverage.sh runs it to turn the
      # per-assembly Cobertura files into the one the gate below reads.
      - name: Restore tools
        run: dotnet tool restore

      # Runs unit tests plus the Testcontainers-backed PostgreSQL integration tests. Docker on
      # this runner is a *rootless* daemon owned by the runner user; the runner exports
      # DOCKER_HOST to its socket, which is how Testcontainers finds it. Nothing here needs to
      # know that, but a job that suddenly cannot reach Docker is a host problem, not a
      # workflow one.
      #
      # The whole suite runs here, integration included. Mutation testing (see
      # .github/workflows/mutation.yml) has to exclude the Postgres-backed classes because it
      # re-runs the suite once per mutant; coverage runs it once, so the ten seconds those
      # tests cost buys an honest number for Alberto.Postgres instead of a near-zero one.
      #
      # build/coverage.sh replaces the bare --collect:"XPlat Code Coverage" that used to be
      # here: it scopes collection to the shipped libraries via build/coverlet.runsettings, so
      # the figure is not diluted by the test and example assemblies.
      - name: Test with coverage
        run: build/coverage.sh --no-build

      # The figure used to be collected but not gated — it showed movement rather than failing
      # builds. It is now a gate. The threshold trails the achieved number rather than leading
      # it, so an unrelated PR is never blocked by a gap it did not introduce; raise it as the
      # suite improves.
      - name: Enforce coverage
        run: python3 build/coverage-summary.py --break 93

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo '## Coverage'
            echo
            echo '```'
            python3 build/coverage-summary.py || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The example modules and their GraphQL schema snapshot. Built separately because they are
      # not referenced by Alberto.Tests; buildable here because the modules are plain SDK
      # projects — only the Api and AppHost need the Aspire workload, and neither is referenced.
      # The snapshot is what proves a refactor of the examples changed nothing a client can see,
      # so it has to run somewhere other than a developer's machine.
      - name: Build examples
        run: dotnet build tests/Alberto.Examples.Tests/Alberto.Examples.Tests.csproj -c Release

      - name: Test examples
        run: dotnet test tests/Alberto.Examples.Tests/Alberto.Examples.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      # No benchmark step here by design. The suite runs on a schedule
      # (.github/workflows/benchmarks.yml), which builds it as part of running it. Benchmarks.Core
      # and Benchmarks.Compare are still compiled here via Alberto.Tests' project references.
      # A break confined to benchmarks/Alberto.Benchmarks therefore surfaces at 02:00 UTC, not on
      # the PR — the accepted cost of keeping PR CI free of benchmark work.

      # Catches the class of bug where a src/ project is packable and depended upon
      # by another packable project but accidentally omitted from the pack list —
      # the .nupkg would be produced but its transitive dependency would never be
      # pushed, causing NU1101 for anyone who installs the package. Packs every
      # packable src project into a temp folder, then restores a throwaway project
      # that references Alberto.Postgres (the deepest Alberto dependency) from
      # that folder only (plus nuget.org for third-party packages). Any missing
      # Alberto.* package makes the restore fail.
      - name: Pack smoke
        run: |
          # The referenced version is derived from VersionPrefix, never hardcoded: a literal here
          # silently turns this check into a no-op restore failure the moment the version is bumped.
          PREFIX=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props | head -1)
          if [ -z "$PREFIX" ]; then
            echo "::error::Could not read <VersionPrefix> from Directory.Build.props"
            exit 1
          fi
          # The packable set comes from .github/packages.txt, never a src/* glob: Alberto.Admin
          # and Alberto.Admin.Postgres build but are deliberately IsPackable=false. The list is
          # collected into an array before any dotnet runs, since dotnet in a `while read` body
          # would inherit the loop's stdin and eat the rest of the list.
          PROJECTS=()
          while IFS= read -r proj; do PROJECTS+=("$proj"); done \
            < <(grep -vE '^\s*(#|$)' .github/packages.txt)
          [ ${#PROJECTS[@]} -gt 0 ] || { echo "::error::.github/packages.txt lists no packages"; exit 1; }
          # Both directories are created fresh per job, under RUNNER_TEMP rather than a fixed
          # /tmp path. This is load-bearing now that the runner is persistent: a stale
          # /tmp/alberto-pack surviving from an earlier run would still hold a package for a
          # project that just stopped being packed, and the restore below would resolve against
          # it and pass. That is exactly the omission this step exists to catch, so the check
          # would go quiet at the moment it was needed. On hosted runners the machine itself
          # provided the freshness.
          PACKDIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/alberto-pack.XXXXXX")
          for proj in "${PROJECTS[@]}"; do
            dotnet pack "src/$proj/$proj.csproj" -c Release --version-suffix ci -o "$PACKDIR"
          done
          SMOKEDIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/alberto-smoke.XXXXXX")
          cat > "$SMOKEDIR/PackCheck.csproj" <<CSPROJ
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup>
            <ItemGroup><PackageReference Include="Alberto.Postgres" Version="$PREFIX-ci" /></ItemGroup>
          </Project>
          CSPROJ
          # --packages sends this restore to a throwaway global-packages folder instead of
          # ~/.nuget/packages. On a persistent runner that is the difference between a real
          # check and a no-op: '-ci' is a fixed suffix, so the first run installs
          # Alberto.Postgres <prefix>-ci into the shared cache and every later run would
          # satisfy the reference straight from there — passing even if the pack loop had
          # stopped producing it. It costs re-downloading this throwaway project's third-party
          # dependencies each run, which is the price of the check meaning anything.
          dotnet restore "$SMOKEDIR/PackCheck.csproj" \
            --packages "$SMOKEDIR/packages" \
            --source "$PACKDIR" \
            --source https://api.nuget.org/v3/index.json

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            artifacts/coverage/report/Cobertura.xml
            artifacts/coverage/report/index.html
          if-no-files-found: error
