name: CI

on:
  pull_request:
  push:
    # release/** is a maintained line: backports land and are tagged there.
    branches: [main, 'release/**']

# Written out so a widened repository default cannot reach a job that builds PR code.
permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# One runner serves the group: supersede a PR's own in-flight run. Pushes to main and
# release/** are exempt so every commit on a maintained line gets a verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    # Self-hosted runner group serving this repository alone (rootless Docker, no docker-group
    # user), because CI on a public repo executes contributor code.
    runs-on: [self-hosted, public-ci]
    # A stop, not a budget: a wedged job blocks the only runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No actions/setup-dotnet: the host's root-owned SDK is used as-is; asking setup-dotnet
      # for it fails the job. global.json pins the feature band.

      # Whole solution, so a break in any project (benchmarks, apps, tools) fails the PR.
      - name: Build
        run: dotnet build Alberto.slnx -c Release

      - name: Check formatting
        run: dotnet format whitespace Alberto.slnx --verify-no-changes --no-restore

      # reportgenerator (.config/dotnet-tools.json), used by build/coverage.sh.
      - name: Restore tools
        run: dotnet tool restore

      # Unit plus Testcontainers integration tests, against the runner's rootless Docker. A
      # "bind: address already in use" during container start is the rootless port allocator
      # race, not a test failure: docs/development/rootless-docker-ports.md.
      - name: Test with coverage
        run: build/coverage.sh --no-build

      # Coverage above runs net10.0 only; this is the same suite on net11.0.
      - name: Test on net11.0
        run: dotnet test tests/Alberto.Tests/Alberto.Tests.csproj -c Release --no-build --framework net11.0

      - name: Test Rebus adapter
        run: dotnet test tests/Alberto.Tests.Messaging.Rebus/Alberto.Tests.Messaging.Rebus.csproj -c Release --no-build

      # Written whatever happened; --annotate puts failures on the Files-changed tab.
      - name: Publish test summary
        if: always()
        run: |
          {
            echo '## Tests'
            echo
            python3 build/test-summary.py 'artifacts/coverage/raw/*.trx' --annotate
          } >> "$GITHUB_STEP_SUMMARY"

      # The threshold trails the achieved number; raise it as the suite improves.
      - name: Enforce coverage
        run: python3 build/coverage-summary.py --break 93

      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo '## Coverage'
            echo
            echo '```'
            python3 build/coverage-summary.py || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Packs every project in .github/packages.txt, then restores a throwaway project that
      # references Alberto.Postgres from that folder only: a packable project missing from the
      # list makes the restore fail (NU1101).
      - name: Pack smoke
        run: |
          # Version comes from VersionPrefix; a hardcoded literal would rot on bump.
          PREFIX=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props | head -1)
          if [ -z "$PREFIX" ]; then
            echo "::error::Could not read <VersionPrefix> from Directory.Build.props"
            exit 1
          fi
          # The set comes from packages.txt, not a src/* glob. Collected into an array first
          # because dotnet inside `while read` would eat the loop's stdin.
          PROJECTS=()
          while IFS= read -r proj; do PROJECTS+=("$proj"); done \
            < <(grep -vE '^\s*(#|$)' .github/packages.txt)
          [ ${#PROJECTS[@]} -gt 0 ] || { echo "::error::.github/packages.txt lists no packages"; exit 1; }
          # Fresh dirs per job: a stale pack folder would let the restore pass for a project
          # that stopped being packed.
          PACKDIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/alberto-pack.XXXXXX")
          for proj in "${PROJECTS[@]}"; do
            dotnet pack "src/$proj/$proj.csproj" -c Release --version-suffix ci -o "$PACKDIR"
          done
          SMOKEDIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/alberto-smoke.XXXXXX")
          cat > "$SMOKEDIR/PackCheck.csproj" <<CSPROJ
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFrameworks>net10.0;net11.0</TargetFrameworks></PropertyGroup>
            <ItemGroup><PackageReference Include="Alberto.Postgres" Version="$PREFIX-ci" /></ItemGroup>
          </Project>
          CSPROJ
          # Throwaway --packages folder: '-ci' is a fixed suffix, so the shared cache would
          # satisfy the reference even if the pack loop stopped producing it.
          dotnet restore "$SMOKEDIR/PackCheck.csproj" \
            --packages "$SMOKEDIR/packages" \
            --source "$PACKDIR" \
            --source https://api.nuget.org/v3/index.json

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: |
            artifacts/coverage/report/Cobertura.xml
            artifacts/coverage/report/index.html
          if-no-files-found: error

  # Native AOT smoke (#178): publishes tests/Alberto.AotSmoke with PublishAot and
  # IlcTreatWarningsAsErrors (any trim/AOT warning fails), then runs the native binary against a
  # real PostgreSQL. A job of its own so "AOT broke" shows on the PR front page.
  aot-smoke:
    runs-on: [self-hosted, public-ci]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # ILC needs clang/zlib, which the host lacks, so publish and run in the AOT SDK image (the
      # binary then never needs the host's glibc).
      - name: Publish (Native AOT)
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            -e DOTNET_NOLOGO=1 -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
            mcr.microsoft.com/dotnet/sdk:11.0-resolute-aot@sha256:f3264ae0bf11e2062b9650e0822d20c999320ac1685fe3acf4b7c17d0881af85 \
            dotnet publish tests/Alberto.AotSmoke/Alberto.AotSmoke.csproj \
              -c Release -r linux-x64 -o artifacts/aot-smoke

      # Plain docker run, not `services:` (rootless daemon). The port is daemon-chosen and read back
      # with `docker port`, so jobs cannot collide. Readiness is probed over TCP because the image's
      # first-boot init server listens on the socket only.
      - name: Start PostgreSQL
        id: pg
        run: |
          name="alberto-aot-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run -d --rm --name "$name" \
            -e POSTGRES_USER=smoke -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=smoke \
            -p 127.0.0.1::5432 postgres:16-alpine@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663
          echo "name=$name" >> "$GITHUB_OUTPUT"
          for _ in $(seq 1 60); do
            docker exec "$name" pg_isready -h 127.0.0.1 -U smoke -d smoke >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec "$name" pg_isready -h 127.0.0.1 -U smoke -d smoke
          port=$(docker port "$name" 5432/tcp | head -1 | sed 's/.*://')
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Run smoke binary
        env:
          ALBERTO_AOTSMOKE_CONNECTION: Host=127.0.0.1;Port=${{ steps.pg.outputs.port }};Username=smoke;Password=smoke;Database=smoke
        run: |
          docker run --rm --network host -v "$PWD/artifacts/aot-smoke":/app -w /app \
            -e ALBERTO_AOTSMOKE_CONNECTION \
            mcr.microsoft.com/dotnet/sdk:11.0-resolute-aot@sha256:f3264ae0bf11e2062b9650e0822d20c999320ac1685fe3acf4b7c17d0881af85 ./Alberto.AotSmoke

      - name: Stop PostgreSQL
        if: always() && steps.pg.outputs.name != ''
        run: docker rm -f "${{ steps.pg.outputs.name }}" || true
