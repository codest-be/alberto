name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Building the test project restores and compiles every referenced library
      # (Alberto.Dcb, Alberto.Dcb.Postgres, Alberto.Dcb.InMemory, ...). The app /
      # Aspire host projects are intentionally excluded — they require the Aspire
      # workload and are not exercised by these tests.
      - name: Build
        run: dotnet build tests/Alberto.Dcb.Tests/Alberto.Dcb.Tests.csproj -c Release

      # Runs unit tests plus the Testcontainers-backed PostgreSQL integration
      # tests (Docker is available on ubuntu-latest runners). Coverage is
      # collected but not gated: the figure exists to show movement across the
      # test-suite remediation sub-projects, not to fail builds.
      - name: Test
        run: dotnet test tests/Alberto.Dcb.Tests/Alberto.Dcb.Tests.csproj -c Release --no-build --logger "console;verbosity=normal" --collect:"XPlat Code Coverage"

      # Proves the benchmark suite still compiles and executes. --job dry runs each case
      # once with no warmup, so it measures nothing — it exists to stop the suite from
      # bit-rotting between nightly runs, which is how benchmark suites usually die.
      - name: Benchmark smoke run
        run: dotnet run -c Release --project benchmarks/Alberto.Dcb.Benchmarks -- --job dry --anyCategories=smoke

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: tests/Alberto.Dcb.Tests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
