# This workflow runs performance tests for the EventStore
# It runs separately to avoid consuming excessive GitHub Actions minutes

name: Performance Tests

on:
  # Manual trigger for performance tests
  workflow_dispatch:
  # Run on releases to check performance regressions
  release:
    types: [created]
  # Weekly performance check on main branch
  schedule:
    - cron: '0 6 * * 1'  # Monday at 6 AM UTC

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: true
      DOTNET_GENERATE_ASPNET_CERTIFICATE: false
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: false
      DOTNET_MULTILEVEL_LOOKUP: 0
      DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true
      TERM: xterm

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.*.props', '**/*.props', '**/*.targets') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run Performance Tests
        run: dotnet run --project Alberto.EventStore.Performance.Tests --configuration Release

      - name: Upload Performance Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-results
          path: |
            Alberto.EventStore.Performance.Tests/BenchmarkDotNet.Artifacts/
            **/*benchmark*.json
            **/*benchmark*.html
          retention-days: 30