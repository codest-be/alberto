name: PR policy

# `pull_request`, not `pull_request_target`: this job reads attacker-controlled text (a PR title
# and body from a fork) and must never run with a writable token or the base repo's secrets.
# Reading issues in a public repo needs neither.
on:
  pull_request:
    types:
      - opened
      - edited          # the Closes # line is usually added by editing the description
      - reopened
      - synchronize
      - labeled         # breaking-change added or removed
      - unlabeled
      - milestoned      # a milestone moving on the PR itself is not what we read, but it is a
      - demilestoned    # cheap signal that triage happened and a re-check is worth running

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-policy:
    name: pr-policy
    # public-ci, not release-ci: check-pr-policy.sh comes from the PR's own merge ref, so it must run on
    # the runner that already executes contributor code (read-only token above).
    runs-on: [self-hosted, public-ci]
    # ~10s in practice; a wedged job would block the single runner.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # A milestone set during triage raises no pull_request event; re-run the job from the Actions tab.
      - name: Check policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/check-pr-policy.sh \
            "${{ github.repository }}" \
            "${{ github.event.pull_request.number }}"
