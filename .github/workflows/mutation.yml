name: Mutation testing

on:
  workflow_dispatch:

# Manual only: the sweep takes hours on the single public-ci runner.

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # The whole-repo number. The floor trails the achieved score; raise it as the score climbs.
  full:
    name: All core packages
    runs-on: [self-hosted, public-ci]
    # ~5h measured on Stryker 4.x; lower after a full 5.0.0 sweep (#133, #167).
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build tests/Alberto.Tests/Alberto.Tests.csproj -c Release

      - name: Mutate core packages
        run: build/mutation-test.sh

      # 70.01% measured with a truthful timeout window (the old 90 counted false Timeouts as kills).
      - name: Enforce aggregate mutation score
        run: python3 build/mutation-summary.py artifacts/stryker --break 68

      - name: Publish summary
        if: always()
        run: |
          {
            echo '## Mutation score — core packages'
            echo
            echo '```'
            python3 build/mutation-summary.py artifacts/stryker || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: mutation-report-full
          path: artifacts/stryker/*/reports/
          if-no-files-found: ignore
