name: Mutation testing

on:
  pull_request:
  schedule:
    # 05:00 UTC. The benchmark suite starts at 02:00 with a 120-minute budget, and there is one
    # runner in the public-ci group, so anything before 04:00 queues behind its worst case
    # rather than running beside it. This is the heaviest job in the repository; it goes last.
    - cron: '0 5 * * *'
  workflow_dispatch:

# There is deliberately no `push` trigger. The full sweep used to run on every push to main and
# release/**, and on one public-ci runner that made it a queue for everything else: the 0.2.0
# release pull request waited about two hours for its checks behind a sweep that then timed out
# anyway. A commit on a maintained line still gets its own verdict, from the nightly cron rather
# than immediately, and what actually gates a change is the `diff` job below. Dispatch this
# workflow by hand when a specific main commit needs the whole number sooner.

permissions:
  contents: read

# Same reasoning as ci.yml, and it bites harder here: one runner in the group, and this is the
# longest job on the PR path. Three pushes in a minute must not leave two dead mutation runs
# squatting on the only machine everybody else's PR is waiting for.
# The nightly and dispatched full sweeps are exempt: they are not superseded by a newer commit
# the way a pull request's run is, and cancelling one wastes hours for nothing.
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # What a PR is actually gated on. Stryker's --since mutates only the code the diff
  # touched, so the run is proportional to the change rather than to the repo: a full
  # sweep of Alberto alone is ~1500 tested mutants and over an hour, which no one would
  # wait for on a PR. The floor here is deliberately higher than the repo aggregate —
  # new code is held to a standard the back catalogue is still climbing towards.
  diff:
    name: Changed code
    if: github.event_name == 'pull_request'
    # Self-hosted, for the same reasons as ci.yml — and because a mutation run is the one job
    # here that genuinely cannot afford a two-core hosted runner: it rebuilds and re-runs the
    # suite once per mutant.
    runs-on: [self-hosted, public-ci]
    # --since keeps a normal PR to minutes, but a PR that touches something Alberto-wide
    # (a shared interface, a global using) mutates most of the package and takes as long as
    # the full sweep. Without a cap that would sit on the only runner in the group until
    # GitHub's six-hour default, blocking every other PR behind it. Forty-five minutes is a
    # stop, not a budget: the signal is "this diff is too broad to gate this way", and the
    # nightly full run covers what this one gives up.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # --since diffs against the merge base, so the history has to be there.
          fetch-depth: 0

      # No actions/setup-dotnet — the host carries the 10.0 SDK under a root-owned path and
      # asking setup-dotnet for it is what fails the job. See the comment in ci.yml.

      - name: Restore tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build tests/Alberto.Tests/Alberto.Tests.csproj -c Release

      - name: Mutate changed code
        run: build/mutation-test.sh --since "origin/${{ github.base_ref }}"

      # --allow-empty because a PR that touches no mutated package legitimately produces
      # no mutants, and "nothing to score" must read as a pass rather than a 0%.
      #
      # 80 rather than the 90 this was, and it now sits ABOVE the aggregate gate instead of a
      # couple of points below it. That inversion is deliberate. The old pair was calibrated
      # against an aggregate inflated by false timeouts; measured truthfully the back catalogue
      # is at 70%, and the point of the diff gate has always been that new code is held to a
      # higher standard than the catalogue without asking anyone to fix the catalogue first.
      # 90 against a real 70% baseline would fail honest pull requests, and a gate people learn
      # to re-run until it passes is worse than no gate.
      - name: Enforce mutation score on changed code
        run: python3 build/mutation-summary.py artifacts/stryker --break 80 --allow-empty

      - name: Publish summary
        if: always()
        run: |
          {
            echo '## Mutation score — changed code'
            echo
            echo '```'
            python3 build/mutation-summary.py artifacts/stryker || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report-diff
          path: artifacts/stryker/*/reports/mutation-report.html
          if-no-files-found: ignore

  # The whole-repo number, off the PR path. Its floor trails the achieved score so an
  # unrelated PR is never blocked by a mutant it did not introduce; raise it as the
  # score climbs.
  full:
    name: All core packages
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, public-ci]
    # Measured, not guessed. The 180 this started at was never enough to finish once: the run on
    # c5c2399 spent 33m on Alberto.Telemetry, 65m on Alberto.InMemory and 46m on Alberto.Messaging
    # (after a failed first attempt that the script retried), then died 35m into Alberto.Commands
    # with Alberto.Testing and Alberto — the largest — not yet started. Six packages at those
    # rates is around five hours, so this is that plus headroom.
    #
    # This number used to carry a note saying it was a stop rather than a target: a quarter to a
    # third of tested mutants came back Timeout, and fixing that was expected to bring the sweep
    # time down with it. The timeouts are fixed — 24 of 2531 scored mutants, 0.95%, down from
    # around a third — and the sweep did NOT get materially faster. A full local sweep on the
    # corrected configuration measured 4h43m against the ~5h it took before.
    #
    # The expectation was simply wrong, and it is worth writing down why so nobody re-derives it.
    # Two effects cancelled. Bounding the suite's waits stopped hung tests from burning a window
    # each, which saved time; giving mutants a window long enough to be scored truthfully means a
    # survivor now runs the suite to completion instead of being cut off partway, which cost it
    # back. The floor underneath both is that the preview MTP runner does not attribute coverage
    # per test, so every covered mutant runs all 1890 tests. Until that is fixed upstream — 4.16.0
    # is the current latest, so there is nothing to upgrade to — roughly five hours is what a
    # truthful sweep of six packages costs.
    #
    # So this stays at 360: 4h43m measured plus about 27% headroom for a runner of unknown speed.
    # Do not raise it. Lowering it is not a matter of trimming the margin either — it needs
    # per-test coverage attribution, which is upstream work.
    # See https://github.com/codest-be/alberto/issues/133.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # No actions/setup-dotnet — see the comment in the diff job above, and in ci.yml.

      - name: Restore tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build tests/Alberto.Tests/Alberto.Tests.csproj -c Release

      - name: Mutate core packages
        run: build/mutation-test.sh

      # 70.01% measured on the corrected configuration. This was 90, and it passed — against a
      # score of 92.59% that counted false Timeouts as kills. Correcting the timeout window did
      # not change one line of test code; it changed 571 mutants from "timed out, call it a kill"
      # to "survived". The gate follows the documented rule that whole-repo thresholds trail the
      # achieved score rather than lead it, because a gate above where the repo sits blocks the
      # pull requests trying to fix it. Raise it as the score climbs.
      - name: Enforce aggregate mutation score
        run: python3 build/mutation-summary.py artifacts/stryker --break 68

      - name: Publish summary
        if: always()
        run: |
          {
            echo '## Mutation score — core packages'
            echo
            echo '```'
            python3 build/mutation-summary.py artifacts/stryker || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report-full
          path: artifacts/stryker/*/reports/
          if-no-files-found: ignore
