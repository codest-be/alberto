name: Release

# Prepares a release; does NOT publish. It opens a PR bumping <VersionPrefix>, cutting the CHANGELOG
# section and promoting the public API. A human then tags the merge commit (publish-packages.yml's
# trigger): nuget.org pushes cannot be undone. Run from `main`, or a `release/**` branch for a patch;
# the branch decides the line.

on:
  workflow_dispatch:
    inputs:
      milestone:
        description: 'Milestone to release (e.g. 0.2.0). Its title is the version, and its closed issues are the notes.'
        required: false
        type: string
      version:
        description: 'Explicit version, for a release with no milestone. Overrides `milestone` and skips its checks.'
        required: false
        type: string
      dry_run:
        description: 'Print the version and the drafted notes, change nothing.'
        required: true
        default: true
        type: boolean

# Two release preparations at once would compute the same version twice.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    # release-ci: runs no contributor code; only workflow_dispatch from a protected branch gets in.
    # Files cross steps via $RUNNER_TEMP, not /tmp, which is shared on this persistent runner.
    runs-on: [self-hosted, release-ci]
    # Scripts and gh calls; no build.
    timeout-minutes: 30
    permissions:
      contents: write        # push the release-prep branch
      pull-requests: write   # open the release pull request
      issues: read           # read milestones for the drafted notes

    steps:
      # fetch-depth 0: apply-release.py checks against the newest tag. RELEASE_TOKEN (see docs/releasing.md)
      # is needed because PRs opened with GITHUB_TOKEN do not trigger CI; without it the PR says so.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Check the branch
        run: |
          case "${GITHUB_REF_NAME}" in
            main|release/*) echo "Releasing from ${GITHUB_REF_NAME}" ;;
            *)
              echo "::error::Releases are cut from \`main\` or a \`release/**\` branch, not \`${GITHUB_REF_NAME}\`."
              exit 1
              ;;
          esac

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          MILESTONE: ${{ inputs.milestone }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          VERSION=$(.github/scripts/resolve-version.sh \
            "${{ github.repository }}" \
            "$MILESTONE" \
            "$VERSION_INPUT")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Draft release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/draft-release-notes.sh \
            "${{ github.repository }}" \
            "${{ steps.version.outputs.version }}" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Apply the release
        run: |
          .github/scripts/apply-release.py \
            --version "${{ steps.version.outputs.version }}" \
            --notes "$RUNNER_TEMP/notes.md" \
            ${{ inputs.dry_run && '--check' || '' }}

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "## Release ${VERSION}"
            echo
            if [ "$DRY_RUN" = "true" ]; then
              echo "> Dry run — nothing was written and no pull request was opened."
              echo
            fi
            echo "Drafted notes:"
            echo
            cat "$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

      # Everything below is skipped on a dry run.
      - name: Open the release pull request
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
        run: |
          BRANCH="release-prep/v${VERSION}"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::error::Branch ${BRANCH} already exists. Delete it, or close the release pull request that owns it, and run again."
            exit 1
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$BRANCH"
          git add Directory.Build.props CHANGELOG.md 'src/*/PublicAPI.*.txt'
          git commit -m "Release ${VERSION}"
          git push origin "$BRANCH"

          {
            echo "Prepared by \`release.yml\` from \`${GITHUB_REF_NAME}\`."
            echo
            echo "- \`<VersionPrefix>\` → \`${VERSION}\`"
            echo "- \`CHANGELOG.md\` — new \`[${VERSION}]\` section"
            echo "- \`PublicAPI.Unshipped.txt\` → \`PublicAPI.Shipped.txt\`"
            echo
            echo "**Edit the changelog section in this pull request.** The entries are issue titles,"
            echo "written to be found rather than to be read, and this is the one editing pass a"
            echo "release gets. Fold in the migration steps for anything labelled \`breaking-change\`."
            echo
            if [ "${HAS_RELEASE_TOKEN}" != "true" ]; then
              echo "> **No checks will appear on this pull request.** It was opened with the"
              echo "> built-in \`GITHUB_TOKEN\`, and GitHub does not trigger workflow runs for"
              echo "> those. **Close this pull request and reopen it** to start them — the"
              echo "> required checks cannot be satisfied otherwise. Setting a \`RELEASE_TOKEN\`"
              echo "> secret removes this step; see docs/releasing.md."
              echo
            fi

            echo "Once this is merged, tag the merge commit to publish:"
            echo
            echo '```'
            echo "git switch ${GITHUB_REF_NAME} && git pull"
            echo "git tag v${VERSION} && git push origin v${VERSION}"
            echo '```'
          } > "$RUNNER_TEMP/pr-body.md"

          # The `release` label exempts this PR from the issue-link policy (check-pr-policy.sh); apply it here only.
          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "$BRANCH" \
            --title "Release ${VERSION}" \
            --label release \
            --body-file "$RUNNER_TEMP/pr-body.md"
