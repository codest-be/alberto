name: GitHub release

# Creates the GitHub release for a tag from that version's CHANGELOG.md section. Kept apart from
# publish-packages.yml so neither job carries a permission it does not use (id-token vs contents:write).

on:
  push:
    tags: ['v*']

  # Backfilling a release for an older tag, or replacing one deleted by mistake.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create the release for (e.g. v1.2.0).'
        required: true
        type: string

concurrency:
  group: github-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # release-ci: runs no contributor code; the trigger is a tag push. Scratch files use $RUNNER_TEMP (persistent runner).
    runs-on: [self-hosted, release-ci]
    # Reads the changelog and calls gh; seconds, not minutes.
    timeout-minutes: 15
    permissions:
      contents: write   # create the release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"

          # An existing release is left alone: it may have been edited by hand.
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — leaving it as it is."
            echo "Release \`${TAG}\` already existed; nothing was changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Fails on a missing section: a tag with no changelog entry has no readable release.
          .github/scripts/extract-changelog-section.py "$VERSION" > "$RUNNER_TEMP/release-notes.md"

          # A version suffix means prerelease, which keeps `Latest` on the newest stable.
          PRERELEASE=""
          case "$VERSION" in
            *-*) PRERELEASE="--prerelease" ;;
          esac

          gh release create "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Alberto ${VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag \
            $PRERELEASE

          {
            echo "## Alberto ${VERSION}"
            echo
            cat "$RUNNER_TEMP/release-notes.md"
          } >> "$GITHUB_STEP_SUMMARY"
